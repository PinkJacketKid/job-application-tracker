{% extends "base.html" %}
{% block title %}Applications{% endblock %}
{% block page_title %}<h1>Application Form</h1>{% endblock %}

{% block content %}
    <a href="{{ url_for('applications') }}" class="btn btn-secondary">Back</a>
    <form method="POST">
        <label>Job</label>
        <select name="job_id" required>
            <option value="">— Select Job —</option>
            {% for job in jobs %}
            <option
              value="{{ job.job_id }}"
              {% if application and application.job_id=""
              ="job.job_id" %}selected{% endif %}>
                {{ j.job_title }} {% if j.company_name %}@ {{ j.company_name }}{% endif %}
            </option>
            {% endfor %}
        </select>

        <label>Status</label>
        <select name="status">
            {% for status in ['Applied','Screening','Interview','Offer','Rejected','Withdrawn'] %}
            <option value="{{ status }}">
                {{ status }}
            </option>
            {% endfor %}
        </select>

        <label>Application Date</label>
        <input type="date" name="application_date" required value="{{ application.application_date.strftime('%Y-%m-%d') if application and application.application_date else '' }}">

        <label>Resume Version</label>
        <input type="text" name="resume_version" value="{{ application.resume_version if application else '' }}" placeholder="v2.1">

        <input type="checkbox"
              name="cover_letter_sent" id="cover_letter_sent" value="1"
              {% if application and application.cover_letter_sent %}
              checked
              {% endif %}>
        <label for="cover_letter_sent">Cover Letter Sent</label>

        <label>Interview Notes (JSON or text)</label>
        <input type="text" name="interview_data" value="{{ application.interview_data if application else '' }}" placeholder='{"rounds": [{"type": "phone"}]}'>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="{{ url_for('applications') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
